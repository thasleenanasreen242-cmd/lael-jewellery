name: Restore LAEL hero label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "!contains(github.event.head_commit.message, 'Restore LAEL hero label to left')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore label position
        run: |
          sed -i 's/absolute bottom-7 right-7 max-w-\[200px\]/absolute bottom-7 left-7 max-w-[200px]/' components/LaelPage.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LaelPage.tsx
          git commit -m "Restore LAEL hero label to left"
          git push
