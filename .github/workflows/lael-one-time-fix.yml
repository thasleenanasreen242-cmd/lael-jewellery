name: LAEL one-time label fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-label:
    if: "!contains(github.event.head_commit.message, 'Move LAEL hero label')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move hero label to right corner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/LaelPage.tsx')
          s = p.read_text()
          old = 'absolute bottom-7 left-7 max-w-[200px] rounded-full'
          new = 'absolute bottom-7 right-7 max-w-[200px] rounded-full'
          if old not in s:
              raise SystemExit('Target label class not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/LaelPage.tsx
          git commit -m "Move LAEL hero label to right corner"
          git push
          rm -f .github/workflows/lael-one-time-fix.yml
          git add .github/workflows/lael-one-time-fix.yml
          git commit -m "Remove one-time LAEL fix workflow"
          git push
