name: LAEL CTA highlight

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  highlight:
    if: "!contains(github.event.head_commit.message, 'Highlight LAEL CTAs')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CTA styling
        run: |
          cat >> app/globals.css <<'EOF'

/* LAEL CTA treatment */
main a:not(:has(img)){position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:1px solid rgba(41,37,31,.18);border-radius:999px;padding:.72rem 1.25rem;background:#29251f;color:#fffdf8;box-shadow:0 8px 22px rgba(41,37,31,.12);font-weight:650;letter-spacing:.16em;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease,border-color .25s ease}
main a:not(:has(img)):hover{transform:translateY(-2px);background:#b79a6a;color:#fffdf8;border-color:#b79a6a;box-shadow:0 12px 28px rgba(183,154,106,.24)}
main a:not(:has(img)):focus-visible{outline:2px solid #b79a6a;outline-offset:4px}
@media (max-width:767px){main a:not(:has(img)){padding:.65rem 1rem;letter-spacing:.13em}}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Highlight LAEL CTAs"
          git push
          rm -f .github/workflows/lael-cta-highlight.yml
          git add .github/workflows/lael-cta-highlight.yml
          git commit -m "Remove one-time CTA workflow"
          git push
